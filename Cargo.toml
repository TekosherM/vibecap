[package]
name = "vibecap"
version = "0.3.0"
edition = "2021"
description = "Native screen recorder and MCP sidecar, plus a web HTTP evidence studio for AI agents"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/TekosherM/vibecap"
homepage = "https://github.com/TekosherM/vibecap"
documentation = "https://github.com/TekosherM/vibecap#readme"
keywords = ["screen-capture", "mcp", "annotation", "egui", "agent", "evidence"]
categories = ["multimedia", "gui", "command-line-utilities", "development-tools"]
authors = ["Vibecap Contributors"]
exclude = [
    "target/",
    "test.png",
    ".vibecap_temp/",
    "Vibecap.app/",
    "**/.DS_Store",
]

[[bin]]
name = "vibecap"
path = "src/main.rs"

[dependencies]
eframe = "0.28"
egui = "0.28"
chrono = "0.4"
rfd = "0.14"
global-hotkey = "0.8"
crossbeam-channel = "0.5.16"
image = "0.25.10"
egui_extras = { version = "0.28", features = ["image"] }
arboard = "3.4"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
dirs = "5"
open = "5"
tray-icon = "0.19"
