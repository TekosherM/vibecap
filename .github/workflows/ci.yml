name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            smoke: true
          - os: ubuntu-latest
            smoke: false
          - os: windows-latest
            smoke: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps (egui / winit / xdo)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev \
            libasound2-dev libudev-dev libxdo-dev pkg-config \
            ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
        continue-on-error: true

      - name: Build release
        run: cargo build --release

      - name: Unit tests (incl. golden theme table)
        run: cargo test

      - name: CLI smoke
        shell: bash
        run: |
          BIN=target/release/vibecap
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN=target/release/vibecap.exe; fi
          "$BIN" --help
          "$BIN" --version
          "$BIN" doctor || true

      - name: MCP smoke (macOS)
        if: matrix.smoke
        shell: bash
        run: |
          chmod +x scripts/smoke_mcp.sh
          ./scripts/smoke_mcp.sh

  # E246 — real gdigrab capture runs in parallel with the unit-test matrix
  # instead of serializing behind it.
  win-capture:
    name: windows gdigrab smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: choco install ffmpeg -y
      - name: Build release
        run: cargo build --release
      - name: gdigrab still
        shell: pwsh
        run: pwsh -File scripts/smoke_capture.ps1

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
