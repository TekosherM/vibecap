name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            smoke: true
          - os: ubuntu-latest
            smoke: false
          - os: windows-latest
            smoke: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps (egui / winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev \
            libasound2-dev libudev-dev pkg-config \
            ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
        continue-on-error: true

      - name: Build release
        run: cargo build --release

      - name: CLI smoke
        shell: bash
        run: |
          BIN=target/release/vibecap
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN=target/release/vibecap.exe; fi
          "$BIN" --help
          "$BIN" --version

      - name: MCP smoke (macOS)
        if: matrix.smoke
        shell: bash
        run: |
          chmod +x scripts/smoke_mcp.sh
          ./scripts/smoke_mcp.sh
